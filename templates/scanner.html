<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoy Scan & Go</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --primary: #38bdf8; /* Zoy Blue */
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-light: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            width: 100%;
            background: rgba(30, 41, 59, 0.8);
            padding: 15px 0;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header span { color: var(--primary); }
        
        .scanner-container {
            width: 90%;
            max-width: 400px;
            margin: 20px auto;
            background: var(--bg-card);
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        /* Overriding the default ugly HTML5-QRCode styles */
        #reader { border: none !important; border-radius: 12px; overflow: hidden; }
        #reader button {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
        }
        
        .cart-container {
            width: 90%;
            max-width: 400px;
            margin-bottom: 80px;
        }
        .cart-header {
            font-size: 18px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }
        .cart-item {
            background: var(--bg-card);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--primary);
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .checkout-btn {
            position: fixed;
            bottom: 20px;
            width: 90%;
            max-width: 400px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
            cursor: pointer;
            transition: 0.2s;
        }
        .checkout-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="header">ZOY <span>SCAN & GO</span></div>

    <div class="scanner-container">
        <div id="reader"></div>
    </div>

    <div class="cart-container">
        <div class="cart-header">
            <strong>Your Cart</strong>
            <span id="cart-total" style="color: var(--primary); font-weight: bold;">₹0.00</span>
        </div>
        <div id="items-list">
            <p id="empty-msg" style="text-align: center; color: #64748b; font-size: 14px; margin-top: 20px;">Scan a barcode to add items</p>
        </div>
    </div>

    <button class="checkout-btn" onclick="checkout()">Pay Now!! </button>

    <script>
        let scannedBarcodes = [];
        let currentTotal = 0.0;
        let isScanning = true; // Taaki ek barcode 10 baar add na ho jaye galti se

        function onScanSuccess(decodedText, decodedResult) {
            if(!isScanning) return;
            
            // Temporary pause scanning so it doesn't read the same barcode instantly 5 times
            isScanning = false; 
            
            fetch(`http://127.0.0.1:8000/api/get-item/${decodedText}`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === "success") {
                        // Empty message hatao
                        document.getElementById('empty-msg').style.display = 'none';
                        
                        // Cart mein add karo
                        scannedBarcodes.push(decodedText);
                        currentTotal += data.data.price;
                        
                        // UI update karo
                        document.getElementById('cart-total').innerText = `₹${currentTotal.toFixed(2)}`;
                        document.getElementById('items-list').innerHTML += `
                            <div class="cart-item">
                                <span>${data.data.name}</span>
                                <strong>₹${data.data.price}</strong>
                            </div>
                        `;
                    } else {
                        console.log("Item not found");
                    }
                    // 2 second baad wapas scan allow karo
                    setTimeout(() => { isScanning = true; }, 2000); 
                });
        }

        let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 150} });
        html5QrcodeScanner.render(onScanSuccess);

        async function checkout() {
            if(scannedBarcodes.length === 0) {
                alert("Boss, Cart khali hai! Pehle kuch scan toh karo.");
                return;
            }

            const res = await fetch("http://127.0.0.1:8000/api/checkout/", {
                method: "POST",
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ barcodes: scannedBarcodes })
            });
            const data = await res.json();
            
            if(data.status === "success") {
                alert(`✅ Payment Success!\nTotal: ₹${data.total_payable}\nToken: ${data.security_exit_token}`);
                // Cart clear kardo success ke baad
                scannedBarcodes = [];
                currentTotal = 0;
                document.getElementById('items-list').innerHTML = `<p id="empty-msg" style="text-align: center; color: #64748b; font-size: 14px; margin-top: 20px;">Scan a barcode to add items</p>`;
                document.getElementById('cart-total').innerText = `₹0.00`;
            } else {
                alert("❌ Checkout failed");
            }
        }
    </script>
</body>
</html>
